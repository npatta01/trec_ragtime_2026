[project]
name = "trec-ragtime-2026"
version = "0.1.0"
description = "Small notebooks and static reference material for TREC RAGTIME 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ipykernel>=6.30.0",
  "ipython>=9.0.0",
  "jupyter>=1.1.0",
  "nbconvert>=7.16.0",
  "nbformat>=5.10.0",
  "pandas>=2.3.0",
  "python-dotenv>=1.2.2",
  "requests>=2.32.0",
  "urllib3>=2.5.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trec_ragtime"
