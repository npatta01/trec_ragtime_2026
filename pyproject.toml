[project]
name = "trec-ragtime-2026"
version = "0.1.0"
description = "Small notebooks and static reference material for TREC RAGTIME 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5.4,<2",
  "fsspec>=2026.6.0",
  "huggingface-hub>=1.5,<2",
  "ipykernel>=6.30.0",
  "ipython>=9.0.0",
  "jupyter>=1.1.0",
  "langchain-text-splitters>=1.1.2,<2",
  "msgspec>=0.19,<1",
  "nbconvert>=7.16.0",
  "nbformat>=5.10.0",
  # 0.0.5 (2025-02-04) is the newest installable Nuggetizer. Every later commit
  # moved the prompts into `src/nuggetizer/prompts/` without adding it to the
  # setuptools `include` list, so a Git-pinned build imports and then fails on
  # `from ..prompts import ...`. Revisit once upstream publishes a fixed release.
  "nuggetizer==0.0.5",
  "openai>=2.47.0,<3",
  "pandas>=2.3.0",
  "python-dotenv>=1.2.2",
  "requests>=2.32.0",
  "requests-ratelimiter>=0.10.0",
  "sentence-transformers==5.7.0",
  "spacy>=3.8,<4",
  "tokenizers==0.22.2",
  "torch==2.9.1",
  "transformers==5.14.1",
  "urllib3>=2.5.0",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
  "ru-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl",
  "zh-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
runpod = ["runpod-flash>=1.18,<2"]

[project.scripts]
ragtime-corpus = "trec_ragtime.corpus_cli:main"
ragtime-query-baseline = "trec_ragtime.query_baselines:main"
ragtime-cache-import = "trec_ragtime.cache_import:main"
ragtime-retrieval-import = "trec_ragtime.retrieval_import:main"
ragtime-nuggets = "trec_ragtime.nuggets_cli:main"
ragtime-report-validate = "trec_ragtime.report_submission:main"
ragtime-report = "trec_ragtime.report_runner:main"
ragtime-retrieval-handoff = "trec_ragtime.retrieval_handoff_cli:main"
ragtime-validate-submission = "trec_ragtime.submission_validation:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trec_ragtime"
