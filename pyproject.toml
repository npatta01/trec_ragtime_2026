[project]
name = "trec-ragtime-2026"
version = "0.1.0"
description = "Small notebooks and static reference material for TREC RAGTIME 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5.4,<2",
  "fsspec>=2026.6.0",
  "huggingface-hub>=1.5,<2",
  "ipykernel>=6.30.0",
  "ipython>=9.0.0",
  "jupyter>=1.1.0",
  "langchain-text-splitters>=1.1.2,<2",
  "msgspec>=0.19,<1",
  "nbconvert>=7.16.0",
  "nbformat>=5.10.0",
  "pandas>=2.3.0",
  "python-dotenv>=1.2.2",
  "requests>=2.32.0",
  "requests-ratelimiter>=0.10.0",
  "sentence-transformers>=5.6,<6",
  "spacy>=3.8,<4",
  "urllib3>=2.5.0",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
  "ru-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl",
  "zh-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
runpod = ["runpod-flash>=1.18,<2"]

[project.scripts]
ragtime-corpus = "trec_ragtime.corpus_cli:main"
ragtime-query-baseline = "trec_ragtime.query_baselines:main"
ragtime-cache-import = "trec_ragtime.cache_import:main"
ragtime-retrieval-import = "trec_ragtime.retrieval_import:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trec_ragtime"
